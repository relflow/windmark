[project]
name = "windmark"
version = "0.1.0"
description = "Multi-Structure Sequence Modeling"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    # ML
    # ? torch>2.3.0 has a GPU memory leak
    "torch==2.3.0",
    "lightning>=2.1.3",
    "tensordict>=0.3.0",
    "jaxtyping>=0.2.25",
    "torchmetrics>=1.3.2",
    # data
    "numpy>=1.26.4",
    "polars>=1.1.0",
    "pytdigest>=0.1.4",
    "pyarrow>=15.0.2",
    "msgspec>=0.18.6",
    "mpire>=2.10.2",
    # orchestration
    "flytekit>=1.14.3",
    "union>=0.1.116",
    # config
    "faker>=24.4.0",
    "hydra-core>=1.3.2",
    # validation
    "beartype>=0.17.0",
    "pydantic>=2.6.4",
    # logging
    "rich>=13.7.0",
    "textual>=0.72.0",
    "wandb>=0.18.3",
    # serving
    "litserve>=0.2.5",
    "valkey[libvalkey]>=6.0.2",
    "aiohttp>=3.11.7",
    "kubernetes>=31.0.0",
    "union-runtime>=0.1.6",
    "neptune>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "interrogate>=1.7.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "nbformat>=5.10.4",
    "pre-commit>=4.0.0",
    "pydoctest>=0.2.1",
    "pyjust>=1.18.1",
    "pysort>=1.0.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "semver>=3.0.2",
]


[tool.ruff]
lint.extend-ignore = ["F722"]
line-length = 120

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-property-decorators = true
ignore-module = true
ignore-setters = true
